<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Get in touch with White Water Rafting for reservations, questions, or feedback about our river tours.">
    <meta name="author" content="Elphus Ngobeni">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Cape Town, South Africa<br>
                <a href="tel:+27215551234">(021) 555-1234</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <section class="contact">

            <h2>Get In Touch</h2>

            <!--
              Using a static map image + external link instead of an embedded Google Maps
              iframe. The live iframe pulls in Google's full Maps JS app (scripts, fonts,
              map tiles, UI controls) on every page load, adding 700+ KB and blowing past
              the project's 500 KB page-weight requirement. A static image + link keeps
              the page lightweight while still giving visitors a way to get directions.
            -->
            <div class="map">
                <a href="https://maps.google.com/maps?q=Kolob+Canyons,+California" target="_blank">
                    <img src="images/map-static.jpg" alt="Map to White Water Rafting Company"
                      width="400" height="300">
                </a>
                <p class="map-note">
                    <a href="https://maps.google.com/maps?q=Kolob+Canyons,+California"
                      target="_blank">
                        Open in Google Maps
                    </a>
                    for directions and live traffic.
                </p>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                      required>
                </div>

                <fieldset class="form-field">
                    <legend>Message Purpose</legend>
                    <label for="purpose-general"><input type="radio" name="purpose"
                          id="purpose-general" value="general" checked> General Inquiry</label>
                    <label for="purpose-reservation"><input type="radio" name="purpose"
                          id="purpose-reservation" value="reservation"> Reservation Question</label>
                    <label for="purpose-suggestion"><input type="radio" name="purpose"
                          id="purpose-suggestion" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="form-field checkbox-field">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee-1.jpg" alt="Photo of Jane Moeng, Lead Guide">
                <figcaption>Jane Moeng &ndash; Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee-2.jpg" alt="Photo of Brenda Maharaj, Safety Officer">
                <figcaption>Brenda Maharaj &ndash; Safety Officer</figcaption>
            </figure>

            <figure>
                <img src="images/employee-3.jpg"
                  alt="Photo of Vusi Kgosi, Customer Service Manager">
                <figcaption>Vusi Kgosi &ndash; Customer Service Manager</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Elphus Ngobeni</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-icon.png" alt="Facebook icon">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-icon.png" alt="Instagram icon">
            </a>

            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.png" alt="LinkedIn icon">
            </a>
        </nav>
    </footer>

</body>

</html>
